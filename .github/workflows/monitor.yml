name: Site monitor
# Watches www.qipu.org from GitHub's runners (never the site's server, never the work machine) and
# pushes to the phone (ntfy) and mails (Resend) when a check breaks, once, then when it is fixed,
# plus a summary every morning. What is checked: site_monitor.py. Setup: SETUP.md.
#
# Lives in its own public repository (publish.sh copies it there as .github/workflows/monitor.yml):
# runner minutes are free on a public repository, and a run every 10 minutes is about 4,300 minutes
# a month, twice what the site's private repository has in all. Nothing secret is in the files;
# every token is a secret of that repository.
#
# Never deploys anything and starts no other workflow. A failing site does not turn the run red
# (it pushes instead); red means the monitor could not notify, or crashed.
on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may start a scheduled run late, or skip one when busy
    - cron: "5 7 * * *"      # 07:05 UTC: the daily summary, the slower checks, one real question to the assistant
  workflow_dispatch:
    inputs:
      summary:
        description: "Send the daily summary now (also asks the assistant one real question)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # keep the schedule alive: GitHub disables schedules after 60 days without a commit

concurrency:
  group: site-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout (the script only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: site_monitor.py
          sparse-checkout-cone-mode: false

      # What the last runs saw (to tell a change once, not every ten minutes). A cache entry per run,
      # the newest restored by prefix; GitHub drops entries unused for a week.
      - name: Last state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: monitor-state.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-

      - name: Check and notify
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://www.qipu.org' }}
          # No ORIGIN_IP: since ~20/11 the server's firewall lets only Cloudflare in, so every origin check
          # waited out its 60 s timeout and the job was cancelled at 8 min (SETUP.md, "Behind the Cloudflare proxy").
          ORIGIN_IP: ""
          ORIGIN_INSECURE: ${{ vars.ORIGIN_INSECURE || '0' }}
          DNS_EXPECT: ${{ vars.DNS_EXPECT }}
          ASK_LIVE: ${{ vars.ASK_LIVE || '1' }}
          OPS_STATUS_TOKEN: ${{ secrets.OPS_STATUS_TOKEN }}
          ALERTS_SECRET: ${{ secrets.ALERTS_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          STATE_FILE: monitor-state.json
          LOG_DETAIL: "0"   # the run logs of a public repository are public: details go to the phone and the mail only
          SUMMARY: ${{ github.event.schedule == '5 7 * * *' || inputs.summary == true }}
        run: |
          if [ -z "$NTFY_TOPIC" ] && [ -z "$MAIL_TO" ]; then
            echo "::error::neither NTFY_TOPIC nor MAIL_TO is set: nobody would be told (SETUP.md)"; exit 1
          fi
          if [ "$SUMMARY" = true ]; then python3 site_monitor.py --summary; else python3 site_monitor.py; fi

      - name: Save state
        if: always() && hashFiles('monitor-state.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: monitor-state.json
          key: monitor-state-${{ github.run_id }}

      - name: Keep the schedule alive
        if: github.event.schedule == '5 7 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/monitor.yml/enable" || echo "::warning::could not re-enable the workflow"
